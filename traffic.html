<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101217"><title>國道即時路況｜William</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#f6f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100dvh;min-height:500px;display:flex;flex-direction:column}.top{padding:14px 16px 0;background:#101217;z-index:1000}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#bfd1ea;text-decoration:none;font-size:.95rem}h1{font-size:1.32rem;line-height:1.3;margin:8px 0 14px;text-align:center}.tabs{display:flex;gap:4px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{background:none;color:#c7cbd4;border:0;border-bottom:3px solid transparent;font:inherit;padding:10px 17px;white-space:nowrap;cursor:pointer;font-size:1rem}.tabs button[aria-selected=true]{border-color:#78d7a0;color:white;font-weight:700}.info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 16px;background:#171b21;border-top:1px solid #29303a;font-size:.88rem}.legend{display:flex;align-items:center;gap:9px;overflow:auto;white-space:nowrap}.chip{display:inline-flex;align-items:center;gap:4px}.swatch{width:13px;height:13px;border-radius:3px;display:inline-block}.refresh{color:#e8f1ff;background:#263346;border:1px solid #43536a;border-radius:8px;padding:7px 10px;font:inherit;white-space:nowrap;cursor:pointer}.time{padding:7px 16px;background:#171b21;color:#cad5e2;font-size:.82rem;min-height:32px}.time.stale{color:#ffd18d;background:#392a1b}.map{flex:1;min-height:0;background:#292d34}.leaflet-container{background:#292d34}.leaflet-control-attribution{background:rgba(15,18,22,.8)!important;color:#dae0e8!important}.leaflet-control-attribution a{color:#a8d0ff!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1d2530;color:#fff}.foot{padding:7px 15px;background:#101217;color:#aab7c7;font-size:.73rem;line-height:1.35}.foot a{color:#a8d0ff}@media(min-width:800px){.top,.info,.time,.foot{padding-left:max(16px,calc((100vw - 1100px)/2));padding-right:max(16px,calc((100vw - 1100px)/2))}}
</style></head><body><div class="app"><header class="top"><div class="header"><a class="back" href="./">← 首頁</a><h1>國道即時路況</h1><span style="width:3rem"></span></div><nav class="tabs" aria-label="查看區域"><button data-region="north" aria-selected="true">北部</button><button data-region="middle">中部</button><button data-region="south">南部</button><button data-region="all">全臺</button></nav></header><div class="info"><div class="legend" aria-label="路況顏色說明"><span class="chip"><i class="swatch" style="background:#21db70"></i>順暢</span><span class="chip"><i class="swatch" style="background:#ffe344"></i>車多</span><span class="chip"><i class="swatch" style="background:#ff9926"></i>緩慢</span><span class="chip"><i class="swatch" style="background:#fa3845"></i>壅塞</span><span class="chip"><i class="swatch" style="background:#8528d6"></i>嚴重</span></div><button class="refresh" id="refresh" type="button">更新</button></div><div class="time" id="status" role="status">讀取路況中…</div><div id="map" class="map" aria-label="國道彩色路況地圖"></div><footer class="foot">資料：<a href="https://data.gov.tw/dataset/37662" target="_blank" rel="noopener">高公局車輛偵測器</a>；底圖 © OpenStreetMap、CARTO；<a href="https://github.com/watermelon1024/freeway-speed-ui" target="_blank" rel="noopener">路段線型</a>（<a href="GEOMETRY-LICENSE.txt">授權</a>）。灰色路線代表該段暫無有效偵測值。<a href="https://1968.freeway.gov.tw/" target="_blank" rel="noopener">官方 1968</a></footer></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const statusEl=document.querySelector('#status');const views={north:{center:[25.02,121.43],zoom:9},middle:{center:[24.11,120.76],zoom:9},south:{center:[22.85,120.46],zoom:9},all:{center:[23.74,120.9],zoom:7}};let map,roadLayer,roads,traffic,region='north';function stamp(v){const d=new Date(v);return Number.isNaN(d.getTime())?'時間未提供':new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}function color(speed){if(speed===null)return '#626972';if(speed<20)return '#8528d6';if(speed<40)return '#fa3845';if(speed<60)return '#ff9926';if(speed<80)return '#ffe344';return '#21db70'}function values(snapshot){const table=new Map();for(const row of snapshot.rows||[]){const lanes=row.lanes||[];let volume=0,weighted=0;for(const lane of lanes){if(Number.isFinite(lane.volume)&&lane.volume>0&&Number.isFinite(lane.speed)&&lane.speed>=0){volume+=lane.volume;weighted+=lane.volume*lane.speed}}if(volume){const id=row.id.split(':').pop();const prev=table.get(id)||{volume:0,weighted:0};prev.volume+=volume;prev.weighted+=weighted;table.set(id,prev)}}return table}function draw(){if(!roads||!map)return;if(roadLayer)roadLayer.remove();const renderer=L.canvas({padding:.5});roadLayer=L.geoJSON(roads,{renderer,style:f=>{const v=traffic?.get(f.properties.id);return{color:color(v?Math.round(v.weighted/v.volume):null),weight:v?4.5:2.5,opacity:v?1:.55}},onEachFeature:(f,layer)=>{layer.on('click',()=>{const v=traffic?.get(f.properties.id);const speed=v?Math.round(v.weighted/v.volume):null;const label=speed===null?'暫無有效路況':speed<20?'嚴重壅塞':speed<40?'壅塞':speed<60?'緩慢':speed<80?'車多':'順暢';const wrap=document.createElement('div');const name=document.createElement('strong');name.textContent=f.properties.name||'國道路段';const state=document.createElement('p');state.textContent=label;wrap.append(name,state);layer.bindPopup(wrap).openPopup()})}}).addTo(map)}async function load(){statusEl.textContent='讀取路況中…';try{const [geo,res]=await Promise.all([roads?Promise.resolve(roads):fetch('highway_links.geojson').then(r=>{if(!r.ok)throw Error('地圖讀取失敗');return r.json()}),fetch('traffic.json?t='+Date.now(),{cache:'no-store'})]);if(!res.ok)throw Error('資料讀取失敗');roads=geo;const snapshot=await res.json();traffic=values(snapshot);const source=snapshot.sourceTime||snapshot.generatedAt;const age=Date.now()-new Date(source).getTime();const stale=!Number.isFinite(age)||age>30*60*1000;statusEl.classList.toggle('stale',stale);statusEl.textContent=(stale?'⚠ 資料已過期｜':'')+'資料時間：'+stamp(source);draw()}catch(e){statusEl.classList.add('stale');statusEl.textContent='目前無法讀取路況，請稍後重試。'}}function select(name){region=name;for(const button of document.querySelectorAll('[data-region]'))button.setAttribute('aria-selected',String(button.dataset.region===name));map.setView(views[name].center,views[name].zoom)}if(window.L){map=L.map('map',{preferCanvas:true,zoomControl:false}).setView(views.north.center,views.north.zoom);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>select(b.dataset.region));document.querySelector('#refresh').onclick=load;load()}else{statusEl.textContent='地圖元件載入失敗，請重新整理頁面。'}
</script></body></html>
