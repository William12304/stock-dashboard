.map{min-height:360px}.map-choose{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#121821;font-size:.88rem}.map-choose select,.map-choose button{color:white;background:#263346;border:1px solid #788ea8;border-radius:6px;padding:7px;font:inherit}.map-choose select{flex:1;min-width:0}.map-choose button{white-space:nowrap}.map-choose button[hidden]{display:none}.map{flex:1!important}.direction-pick{display:flex;align-items:center;gap:5px;padding:5px 12px;background:#121821}.direction-pick button{flex:1;padding:7px 3px;border:1px solid #61758f;border-radius:5px;color:#f4f8ff;background:#253447;font:700 .86rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.direction-pick button[aria-pressed="true"]{background:#3972a8;border-color:#a7d2ff}</style></head><body><div class="app"><header class="top"><div class="header"><a class="back" href="./">← 首頁</a><h1>國道即時路況</h1><span style="width:3rem"></span></div><nav class="tabs" aria-label="查看區域"><button data-region="north" aria-selected="true">北部</button><button data-region="middle">中部</button><button data-region="south">南部</button><button data-region="all">全臺</button></nav></header><div class="info"><div class="legend" aria-label="路況顏色說明"><span class="chip"><i class="swatch" style="background:#21db70"></i>順暢</span><span class="chip"><i class="swatch" style="background:#ffe344"></i>車多</span><span class="chip"><i class="swatch" style="background:#ff9926"></i>緩慢</span><span class="chip"><i class="swatch" style="background:#ff304a"></i>壅塞</span><span class="chip"><i class="swatch" style="background:#b44bff"></i>嚴重</span></div><div class="actions"><button class="refresh" id="locate" type="button">◎ 我的位置</button><button class="refresh" id="refresh" type="button">更新</button></div></div><div class="time" id="status" role="status">讀取路況中…</div><div class="map-choose"><label for="road-select-map">選擇國道</label><select id="road-select-map" aria-label="地圖國道"><option value="1">國道1號</option><option value="2">國道2號</option><option value="3">國道3號</option><option value="4">國道4號</option><option value="5">國道5號</option><option value="6">國道6號</option><option value="8">國道8號</option><option value="10">國道10號</option></select><button id="level-map" type="button">切換至國一高架</button></div><div class="direction-pick" aria-label="查看行車方向"><button type="button" data-direction="both" aria-pressed="true">雙向</button><button type="button" data-direction="first" aria-pressed="false">↑ 北上</button><button type="button" data-direction="second" aria-pressed="false">↓ 南下</button></div><div id="map" class="map" aria-label="每公里方格國道路況地圖"></div><footer class="foot">資料：<a href="https://data.gov.tw/dataset/37662" target="_blank" rel="noopener">高公局車輛偵測器</a>；底圖 © OpenStreetMap、CARTO；<a href="https://github.com/watermelon1024/freeway-speed-ui" target="_blank" rel="noopener">路段線型</a>（<a href="GEOMETRY-LICENSE.txt">授權</a>）。灰色路線代表該段暫無有效偵測值。<a href="https://1968.freeway.gov.tw/" target="_blank" rel="noopener">官方 1968</a></footer></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const statusEl = document.querySelector('#status');
const locateButton = document.querySelector('#locate');
const views = {
  north: { center: [25.05, 121.30], zoom: 13 },
  middle: { center: [24.11, 120.76], zoom: 10 },
  south: { center: [22.85, 120.46], zoom: 10 },
  all: { center: [23.74, 120.9], zoom: 7 }
};
let map, roadLayer, casingLayer, roads, traffic, userMarker, userPosition, nearbyFeatures = [];
let region = 'north', directionView = 'both', dataMessage = '讀取路況中…';

function staleSnapshot(snapshot) {
  const age=Date.now()-new Date(snapshot.sourceTime||snapshot.generatedAt).getTime();
  return !Number.isFinite(age)||age>30*60000;
}
function stamp(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '時間未提供' : new Intl.DateTimeFormat('zh-TW', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }).format(date);
}
function color(speed) {
  if (speed === null) return '#626972';
  if (speed < 20) return '#b44bff';
  if (speed < 40) return '#ff304a';
  if (speed < 60) return '#ff9926';
  if (speed < 80) return '#ffe344';
  return '#21db70';
}
function values(snapshot) {
  const table = new Map();
  for (const row of snapshot.rows || []) {
    let volume = 0, weighted = 0;
    for (const lane of row.lanes || []) {
      if (Number.isFinite(lane.volume) && lane.volume > 0 &&
          Number.isFinite(lane.speed) && lane.speed >= 0) {
        volume += lane.volume;
        weighted += lane.volume * lane.speed;
      }
    }
    if (volume) {
      const id = row.id.split(':').pop();
      const previous = table.get(id) || { volume: 0, weighted: 0 };
      previous.volume += volume;
      previous.weighted += weighted;
      table.set(id, previous);
    }
  }
  return table;
}
let roadNumber = '1', roadLevel = 'flat';
let kilometerBins = new Map(), linkMeta = new Map();
function routeCode() { return 'N' + roadNumber + (roadNumber === '1' && roadLevel === 'elevated' ? 'H' : ''); }
function detectorInfo(row) {
  const match = /^VD-(N\d+[A-Z]?)-([NSEW])-(\d+(?:\.\d+)?)/i.exec(row.id || '');
  if (!match) return null;
  return { code: match[1].toUpperCase(), direction: match[2].toUpperCase(),
    kilometer: Math.floor(Number(match[3])), link: row.id.split(':').pop() };
}
function buildKilometerData(snapshot) {
  kilometerBins = new Map(); linkMeta = new Map();
  for (const row of snapshot.rows || []) {
    const info = detectorInfo(row);
    if (!info) continue;
    linkMeta.set(info.link, info);
    let flow = 0, weighted = 0;
    for (const lane of row.lanes || []) {
      if (Number.isFinite(lane.volume) && lane.volume > 0 &&
          Number.isFinite(lane.speed) && lane.speed >= 0) {
        flow += lane.volume; weighted += lane.volume * lane.speed;
      }
    }
    if (!flow) continue;
    const key = info.code + ':' + info.direction + ':' + info.kilometer;
    const speed = weighted / flow;
    // Several detectors in the same kilometer: preserve the slowest valid reading.
    const old = kilometerBins.get(key);
    if (!old || speed < old.speed) kilometerBins.set(key, { speed, link: info.link });
  }
}
function congestionName(speed) {
  return speed === null ? '無資料' : speed < 20 ? '嚴重壅塞' : speed < 40 ? '壅塞' :
    speed < 60 ? '緩慢' : speed < 80 ? '車多' : '順暢';
}
function nearestRoute(latitude, longitude) {
  let best, distance = Infinity;
  if (!roads) return null;
  for (const feature of roads.features) {
    const info = linkMeta.get(feature.properties.id);
    if (!info || !/^N(1H?|2|3|4|5|6|8|10)$/.test(info.code)) continue;
    const geometry = feature.geometry;
    const lines = geometry.type === 'LineString' ? [geometry.coordinates] : geometry.coordinates;
    const km = Math.min(...lines.map(line => lineDistanceKm(line, latitude, longitude)));
    // GPS cannot resolve an elevated deck from the ground road. Prefer ground on ties.
    const adjusted = km + (info.code === 'N1H' ? .02 : 0);
    if (adjusted < distance) { distance = adjusted; best = info; }
  }
  return best && distance < 60 ? best : null;
}
function chooseRouteAt(latitude, longitude) {
  const nearest = nearestRoute(latitude, longitude);
  if (!nearest) return;
  const road = /^N(\d+)/.exec(nearest.code);
  roadNumber = road[1]; roadLevel = nearest.code === 'N1H' ? 'elevated' : 'flat';
  document.querySelector('#road-select-map').value = roadNumber; updateLevelButton(); updateDirections();
}

// Find roads near the GPS point, including lines that cross the area between vertices.
function lineDistanceKm(line, latitude, longitude) {
  const scaleX = 111 * Math.cos(latitude * Math.PI / 180), scaleY = 111;
  let closest = Infinity;
  for (let i = 0; i < line.length; i++) {
    const a = line[i], b = line[Math.min(i + 1, line.length - 1)];
    const ax = (a[0] - longitude) * scaleX, ay = (a[1] - latitude) * scaleY;
    const bx = (b[0] - longitude) * scaleX, by = (b[1] - latitude) * scaleY;
    const dx = bx - ax, dy = by - ay;
    const t = dx || dy ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / (dx * dx + dy * dy))) : 0;
    closest = Math.min(closest, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return closest;
}
function nearby(feature, latitude, longitude, radiusKm) {
  const geometry = feature.geometry;
  const lines = geometry.type === 'LineString' ? [geometry.coordinates] : geometry.coordinates;
  return lines.some(line => lineDistanceKm(line, latitude, longitude) <= radiusKm);
}
// Link IDs contain the kilometer position in hundredths after the 8-character carriageway code.
const carriageways = {
  '00001000':['N1','S'], '00001001':['N1','N'],
  '00001A00':['N1H','S'], '00001A01':['N1H','N'],
  '00001B00':['N1H','S'], '00001B01':['N1H','N'],
  '00002000':['N2','E'], '00002001':['N2','W'],
  '00003000':['N3','S'], '00003001':['N3','N'],
  '00004000':['N4','E'], '00004001':['N4','W'],
  '00005000':['N5','S'], '00005001':['N5','N'],
  '00006000':['N6','E'], '00006001':['N6','W'],
  '00008000':['N8','E'], '00008001':['N8','W'],
  '00010000':['N10','E'], '00010001':['N10','W']
};
let mapCells = [];
function buildMapCells() {
  mapCells = [];
  const groups = new Map();
  for (const feature of roads.features) {
    const id = feature.properties.id;
    const route = carriageways[id.slice(0,8)];
    const mile = Number(id.slice(8,13)) / 100;
    if (!route || !Number.isFinite(mile) || mile > 500 || feature.geometry.type !== 'LineString') continue;
    if (!groups.has(id.slice(0,8))) groups.set(id.slice(0,8), []);
    groups.get(id.slice(0,8)).push({ feature, mile, route });
  }
  for (const entries of groups.values()) {
    entries.sort((a,b) => a.mile-b.mile);
    for (let i=0;i<entries.length;i++) {
      const {feature,mile,route} = entries[i];
      const line=feature.geometry.coordinates;
      if (line.length<2) continue;
      const next=entries[i+1]?.mile;
      // A missing next marker uses the physical length of the road geometry.
      const lengths=[0];
      for(let j=1;j<line.length;j++) lengths.push(lengths[j-1]+Math.hypot((line[j][0]-line[j-1][0])*101,(line[j][1]-line[j-1][1])*111));
      const total=lengths.at(-1);
      if (!total) continue;
      const end=next>mile && next-mile<3 ? next : mile+total;
      if (end-mile>3) continue;
      const pointAt=fraction=>{
        const target=fraction*total;let j=1;
        while(j<lengths.length-1 && lengths[j]<target) j++;
        const f=(target-lengths[j-1])/(lengths[j]-lengths[j-1]||1);
        return [line[j-1][0]+f*(line[j][0]-line[j-1][0]),line[j-1][1]+f*(line[j][1]-line[j-1][1])];
      };
      let from=mile;
      while(from<end-0.00001){
        const to=Math.min(end,Math.floor(from+0.00001)+1);
        const a=(from-mile)/(end-mile), b=(to-mile)/(end-mile);
        const coordinates=[pointAt(a)];
        for(let j=1;j<line.length-1;j++) if(lengths[j]/total>a && lengths[j]/total<b) coordinates.push(line[j]);
        coordinates.push(pointAt(b));
        mapCells.push({code:route[0],direction:route[1],kilometer:Math.floor(from+0.00001),coordinates});
        from=to;
      }
    }
  }
}
function updateDirections() {
  const ew=['2','4','6','8','10'].includes(roadNumber);
  document.querySelector('[data-direction=first]').textContent=ew?'→ 東行':'↑ 北上';
  document.querySelector('[data-direction=second]').textContent=ew?'← 西行':'↓ 南下';
  for(const button of document.querySelectorAll('[data-direction]')) button.setAttribute('aria-pressed',String(button.dataset.direction===directionView));
}
function updateLevelButton() {
  const button=document.querySelector('#level-map');
  button.hidden=roadNumber!=='1';
  button.textContent=roadLevel==='flat'?'切換至國一高架':'切換至國一平面';
}
function displayedRoads() {
  const eastWest=['2','4','6','8','10'].includes(roadNumber);
  const first=eastWest?'E':'N', second=eastWest?'W':'S';
  const selected=mapCells.filter(c=>c.code===routeCode() && (directionView==='both' || c.direction===(directionView==='first'?first:second)));
  if(region!=='nearby'||!userPosition) return selected;
  const [lat,lon]=userPosition;
  const close=selected.filter(c=>lineDistanceKm(c.coordinates,lat,lon)<12);
  const wider=close.length?close:selected.filter(c=>lineDistanceKm(c.coordinates,lat,lon)<40);
  statusEl.textContent=wider.length?'附近國道路況｜'+dataMessage:'附近沒有此國道路段｜'+dataMessage;
  return wider;
}
function severity(feature) {
  const value = traffic?.get(feature.properties.id);
  if (!value) return 0;
  const speed = value.weighted / value.volume;
  return speed < 20 ? 5 : speed < 40 ? 4 : speed < 60 ? 3 : speed < 80 ? 2 : 1;
}
function draw() {
  if (!roads || !map) return;
  if (roadLayer) roadLayer.remove();
  if (casingLayer) casingLayer.remove();
  const cells=displayedRoads();
  const renderer=L.svg({padding:.5});
  casingLayer=L.layerGroup().addTo(map);
  roadLayer=L.layerGroup().addTo(map);
  for(const cell of cells){
    // Shift each carriageway to its own screen lane, keeping opposite directions apart.
    const points=cell.coordinates.map(([lon,lat])=>map.latLngToLayerPoint([lat,lon]));
    const latlngs=points.map((point,i)=>{
      const before=points[Math.max(0,i-1)], after=points[Math.min(points.length-1,i+1)];
      const dx=after.x-before.x,dy=after.y-before.y,len=Math.hypot(dx,dy)||1;
      return map.layerPointToLatLng(L.point(point.x-dy/len*8,point.y+dx/len*8));
    });
    const item=kilometerBins.get(cell.code+':'+cell.direction+':'+cell.kilometer);
    const label=congestionName(item?.speed??null);
    L.polyline(latlngs,{renderer,color:'#080b0f',weight:20,opacity:1,lineCap:'butt',lineJoin:'bevel',interactive:false}).addTo(casingLayer);
    L.polyline(latlngs,{renderer,color:color(item?.speed??null),weight:14,opacity:1,lineCap:'butt',lineJoin:'bevel'})
      .bindPopup(cell.code+' '+cell.kilometer+'K '+({N:'北上',S:'南下',E:'東行',W:'西行'}[cell.direction])+'：'+label).addTo(roadLayer);
  }
  if(userMarker) userMarker.bringToFront();
}
// TDX offers a second official feed when the Freeway Bureau host is unreachable.
async function tdxSnapshot(reference) {
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),9000);
  try {
    const url='https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/Freeway?%24top=3000&%24format=JSON';
    const response=await fetch(url,{cache:'no-store',signal:controller.signal});
    if(!response.ok) throw Error('TDX 回應失敗');
    const result=await response.json();
    const known=new Map(reference.rows.map(row=>[row.id,row]));
    const rows=[];
    for(const vd of result.VDLives||[]) {
      if(Number(vd.Status)!==0) continue;
      for(const flow of vd.LinkFlows||[]) {
        const old=known.get(vd.VDID+':'+flow.LinkID);
        if(!old) continue;
        const lanes=(flow.Lanes||[]).map(lane=>({
          speed:Number(lane.Speed),
          volume:(lane.Vehicles||[]).reduce((sum,v)=>sum+Number(v.Volume),0)
        })).filter(lane=>Number.isFinite(lane.speed)&&lane.speed>=0&&Number.isFinite(lane.volume)&&lane.volume>=0);
        if(lanes.length) rows.push({...old,time:vd.DataCollectTime,lanes});
      }
    }
    const sourceTime=result.SrcUpdateTime||result.UpdateTime;
    if(rows.length<100||!sourceTime||Date.now()-new Date(sourceTime).getTime()>15*60000)
      throw Error('TDX 資料不足或過期');
    return {rows,sourceTime};
  } finally {clearTimeout(timer);}
}
// Ask the official one-minute feed on every page visit. A Pages snapshot is only a fallback.
async function freshSnapshot(reference) {
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),9000);
  try {
    const response=await fetch('https://tisvcloud.freeway.gov.tw/history/motc20/VDLive.xml?t='+Date.now(),{
      cache:'no-store',signal:controller.signal
    });
    if(!response.ok) throw Error('官方來源回應失敗');
    const xml=new DOMParser().parseFromString(await response.text(),'application/xml');
    if(xml.getElementsByTagName('parsererror').length) throw Error('官方資料格式錯誤');
    const nodes=(node,name)=>Array.from(node.getElementsByTagNameNS('*',name));
    const value=(node,name)=>nodes(node,name)[0]?.textContent?.trim()||'';
    const known=new Map(reference.rows.map(row=>[row.id,row]));
    const rows=[];
    for(const vd of nodes(xml,'VDLive')) {
      if(value(vd,'Status')!=='0') continue;
      const id=value(vd,'VDID'),time=value(vd,'DataCollectTime');
      for(const flow of nodes(vd,'LinkFlow')) {
        const old=known.get(id+':'+value(flow,'LinkID'));
        if(!old) continue;
        const lanes=nodes(flow,'Lane').map(lane=>({
          speed:Number(value(lane,'Speed')),
          volume:nodes(lane,'Vehicle').reduce((sum,v)=>sum+Number(value(v,'Volume')||0),0)
        })).filter(lane=>Number.isFinite(lane.speed)&&lane.speed>=0&&Number.isFinite(lane.volume));
        if(lanes.length) rows.push({...old,time,lanes});
      }
    }
    if(rows.length<100) throw Error('官方測點資料不足');
    const rawTime=value(xml,'UpdateTime')||rows[0].time;
    const sourceTime=/Z$|[+-]\d\d:\d\d$/.test(rawTime)?rawTime:rawTime+'+08:00';
    if(Date.now()-new Date(sourceTime).getTime()>15*60000) throw Error('官方資料過期');
    return {rows,sourceTime};
  } finally { clearTimeout(timer); }
}
async function load() {
  statusEl.textContent = '讀取路況中…';
  try {
    const [geometry, response] = await Promise.all([
      roads ? Promise.resolve(roads) : fetch('highway_links.geojson').then(r => {
        if (!r.ok) throw Error('地圖讀取失敗');
        return r.json();
      }),
      fetch('traffic.json?t=' + Date.now(), { cache: 'no-store' })
    ]);
    if (!response.ok) throw Error('資料讀取失敗');
    roads = geometry;
    buildMapCells();
    const cached = await response.json();
    let snapshot=cached, direct=false;
    try { snapshot=await freshSnapshot(cached); direct=true; }
    catch(error) { try {snapshot=await tdxSnapshot(cached); direct=true;} catch(fallbackError) { /* No current data. */ } }
    traffic = direct || !staleSnapshot(snapshot) ? values(snapshot) : new Map();
    buildKilometerData(snapshot);
    if(staleSnapshot(snapshot)) kilometerBins.clear();
    const sourceTime = snapshot.sourceTime || snapshot.generatedAt;
    const age = Date.now() - new Date(sourceTime).getTime();
    const stale = !Number.isFinite(age) || age > 30 * 60 * 1000;
    dataMessage = (stale ? '⚠ 資料已過期，地圖灰色｜' : '') + (direct ? '官方資料｜' : '⚠ 官方來源未連線｜') + '資料時間：' + stamp(sourceTime);
    statusEl.classList.toggle('stale', stale || !direct);
    statusEl.textContent = dataMessage;
    draw();
  } catch (error) {
    statusEl.classList.add('stale');
    statusEl.textContent = '目前無法讀取路況，請稍後重試。';
  }
}
function select(name) {
  region = name;
  locateButton.classList.remove('active');
  for (const button of document.querySelectorAll('[data-region]')) {
    button.setAttribute('aria-selected', String(button.dataset.region === name));
  }
  statusEl.textContent = dataMessage;
  if (userMarker) { userMarker.remove(); userMarker = null; }
  map.setView(views[name].center, name === 'all' ? 8 : 13);
  draw();
}
function locate() {
  if (!navigator.geolocation) {
    statusEl.textContent = dataMessage + '｜此裝置無法使用定位。';
    return;
  }
  locateButton.disabled = true;
  statusEl.textContent = '正在取得你的位置…';
  navigator.geolocation.getCurrentPosition(position => {
    locateButton.disabled = false;
    const { latitude, longitude } = position.coords;
    userPosition = [latitude, longitude];
    chooseRouteAt(latitude, longitude);
    region = 'nearby';
    for (const button of document.querySelectorAll('[data-region]')) button.setAttribute('aria-selected', 'false');
    locateButton.classList.add('active');
    if (userMarker) userMarker.remove();
    userMarker = L.circleMarker(userPosition, {
      radius: 9, color: '#fff', weight: 3, fillColor: '#2989ff', fillOpacity: 1,
      interactive: false
    }).addTo(map);
    draw();
    map.setView(userPosition, 13);
  }, error => {
    locateButton.disabled = false;
    const detail = error.code === 1 ? '請在瀏覽器允許位置存取。' : '無法取得位置，請稍後再試。';
    statusEl.textContent = dataMessage + '｜' + detail;
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
if (window.L) {
  map = L.map('map', { preferCanvas: true, zoomControl: false }).setView(views.north.center, views.north.zoom);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18
  }).addTo(map);
  document.querySelectorAll('[data-region]').forEach(button => button.onclick = () => select(button.dataset.region));
  document.querySelector('#refresh').onclick = load;
  locateButton.onclick = locate;
  document.querySelector('#road-select-map').onchange = event => {
    roadNumber = event.target.value; roadLevel = 'flat';
    updateLevelButton(); updateDirections(); draw();
  };
  document.querySelector('#level-map').onclick = () => {
    roadLevel = roadLevel === 'flat' ? 'elevated' : 'flat';
    updateLevelButton(); draw();
  };
  document.querySelectorAll('[data-direction]').forEach(button => button.onclick = () => {
    directionView=button.dataset.direction; updateDirections(); draw();
  });
  map.on('zoomend',draw);
  updateLevelButton(); updateDirections();
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) hiddenAt=Date.now();
    else if(hiddenAt && Date.now()-hiddenAt>30000) load();
  });
  window.addEventListener('pageshow',event=>{if(event.persisted) load();});
  setInterval(()=>{if(!document.hidden) load();},60000);
  load();
} else {
  statusEl.textContent = '地圖元件載入失敗，請重新整理頁面。';
}
</script></body></html>
