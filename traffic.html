<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>國道即時車流｜William</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:20px}a{color:#9cc4ff}.back{text-decoration:none;color:#b9cae6}h1{font-size:clamp(1.7rem,5vw,2.5rem);margin:22px 0 7px}.intro,.note,#status{color:#aebfda;line-height:1.6}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}label{display:grid;gap:7px;color:#c7d8ef;font-size:.9rem}select,input,button{background:#1b2c48;color:#f2f7ff;border:1px solid #3c5578;border-radius:10px;padding:11px;font:inherit;min-width:0}button{cursor:pointer}button:hover{background:#29456d}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.card{border:1px solid #304562;background:#152239;border-radius:16px;padding:18px;min-width:0}.card h2{font-size:1.15rem;margin:0 0 6px}.sub{color:#aebfda;font-size:.88rem;margin:0 0 13px}.summary{font-size:1.05rem;margin:9px 0 15px}.summary strong{color:#8edabd;font-size:1.45rem}.lane{display:grid;grid-template-columns:minmax(65px,1fr) repeat(2,minmax(72px,.8fr));gap:8px;padding:9px 0;border-top:1px solid #2c405d;align-items:center;font-variant-numeric:tabular-nums}.lane span:not(:first-child){text-align:right}.lane small{display:block;color:#aebfda;font-size:.76rem}.note{font-size:.82rem}.empty{padding:28px;border:1px solid #304562;border-radius:14px;color:#b9cae6}.pagination{display:flex;gap:10px;justify-content:center;align-items:center;margin:24px 0}@media(max-width:720px){main{padding:15px}.controls{grid-template-columns:1fr 1fr}.controls label:last-child{grid-column:1/-1}.cards{grid-template-columns:1fr}}
</style></head><body><main><a class="back" href="./">← 首頁</a><h1>國道 1968 · 車流資訊</h1><p class="intro">選擇國道與方向，查看偵測器各車道的每分鐘車流量和平均車速。</p><div class="controls"><label>國道<select id="road"><option value="">全部國道</option></select></label><label>方向<select id="direction"><option value="">全部方向</option><option value="N">北上</option><option value="S">南下</option><option value="E">東行</option><option value="W">西行</option></select></label><label>里程或測點搜尋<input id="search" placeholder="例如 35、林口、VD 編號" autocomplete="off"></label></div><div class="toolbar"><span id="status" role="status">讀取資料中…</span><button type="button" id="refresh">更新畫面</button></div><div id="results" class="cards"></div><div class="pagination" id="pagination"></div><p class="note">資料來源：<a href="https://data.gov.tw/dataset/37662" target="_blank" rel="noopener noreferrer">交通部高速公路局 VD 一分鐘動態資訊</a>及<a href="https://data.gov.tw/dataset/37661" target="_blank" rel="noopener noreferrer">偵測器位置資料</a>。每筆為測點當分鐘通過車輛數，非整條國道總車流；偵測器異常值不列入。網站約每 10 分鐘擷取一次，實際更新時間依上方標示；行車請以現場標誌與<a href="https://1968.freeway.gov.tw/" target="_blank" rel="noopener noreferrer">官方 1968</a>為準。</p></main><script>
const road=document.querySelector('#road'),direction=document.querySelector('#direction'),search=document.querySelector('#search'),results=document.querySelector('#results'),statusEl=document.querySelector('#status'),pagination=document.querySelector('#pagination');let data=[],page=0,stamp='';const tz={timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'};function time(v){const d=new Date(v);return Number.isNaN(d.getTime())?'時間未提供':new Intl.DateTimeFormat('zh-TW',tz).format(d)}function dir(v){return ({N:'北上',S:'南下',E:'東行',W:'西行'}[v]||v||'方向未提供')}function laneType(v){return ({1:'一般',2:'快車道',3:'慢車道',5:'高乘載',8:'路肩',9:'輔助車道'}[v]||'車道')}function text(el,s){el.textContent=s;return el}function node(tag,cls,s){const el=document.createElement(tag);if(cls)el.className=cls;if(s!==undefined)el.textContent=s;return el}function render(){const q=search.value.trim().toLowerCase();const rows=data.filter(r=>(!road.value||r.road===road.value)&&(!direction.value||r.direction===direction.value)&&(!q||[r.road,r.mile,r.id].some(v=>String(v||'').toLowerCase().includes(q))));const count=rows.length;page=Math.min(page,Math.max(0,Math.ceil(count/30)-1));const age=Date.now()-new Date(stamp).getTime();const stale=!Number.isFinite(age)||age>30*60*1000;statusEl.textContent=`${stale?'⚠ 資料已過期｜':''}資料時間 ${time(stamp)}｜符合 ${count} 個測點`;results.replaceChildren();pagination.replaceChildren();if(!count){results.append(node('div','empty',data.length?'沒有符合條件的測點，請調整篩選。':'目前無法取得車流資料，請稍後再試或查看官方 1968。'));return}for(const r of rows.slice(page*30,(page+1)*30)){const c=node('article','card');c.append(node('h2','',`${r.road} ${dir(r.direction)} · ${r.mile||'里程未提供'}`),node('p','sub',`測點 ${r.id.split(':')[0]}｜${time(r.time)}`));const valid=r.lanes.map(l=>l.volume).filter(v=>v!==null);c.append(node('p','summary',`測得車流 ${valid.length?valid.reduce((a,b)=>a+b,0):'—'} 輛／分鐘`));for(const l of r.lanes){const row=node('div','lane');row.append(node('span','',`${l.id} ${laneType(l.type)}`),node('span','',l.volume===null?'—':`${l.volume} 輛`),node('span','',l.speed===null?'—':`${Math.round(l.speed)} km/h`));c.append(row)}results.append(c)}if(count>30){const prev=node('button','','上一頁'),next=node('button','','下一頁');prev.disabled=page===0;next.disabled=(page+1)*30>=count;prev.onclick=()=>{page--;render();scrollTo(0,0)};next.onclick=()=>{page++;render();scrollTo(0,0)};pagination.append(prev,node('span','',`${page+1} / ${Math.ceil(count/30)}`),next)}}async function load(){statusEl.textContent='讀取資料中…';try{const res=await fetch(`traffic.json?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();data=Array.isArray(json.rows)?json.rows:[];stamp=json.sourceTime||json.generatedAt||'';const previous=road.value;const names=[...new Set(data.map(r=>r.road))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));road.replaceChildren(node('option','','全部國道'));for(const name of names){const option=node('option','',name);option.value=name;road.append(option)}road.value=previous;render()}catch(e){data=[];stamp='';render();statusEl.textContent='讀取失敗，請稍後再試。'}}for(const el of [road,direction,search])el.addEventListener(el===search?'input':'change',()=>{page=0;render()});document.querySelector('#refresh').onclick=load;load();
</script></body></html>
