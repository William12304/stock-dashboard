<style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#f6f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100dvh;min-height:500px;display:flex;flex-direction:column}.top{padding:14px 16px 0;background:#101217;z-index:1000}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#bfd1ea;text-decoration:none;font-size:.95rem}h1{font-size:1.32rem;line-height:1.3;margin:8px 0 14px;text-align:center}.tabs{display:flex;gap:4px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{background:none;color:#c7cbd4;border:0;border-bottom:3px solid transparent;font:inherit;padding:10px 17px;white-space:nowrap;cursor:pointer;font-size:1rem}.tabs button[aria-selected=true]{border-color:#78d7a0;color:white;font-weight:700}.info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 16px;background:#171b21;border-top:1px solid #29303a;font-size:.88rem}.legend{display:flex;align-items:center;gap:9px;overflow:auto;white-space:nowrap}.chip{display:inline-flex;align-items:center;gap:4px}.swatch{width:13px;height:13px;border-radius:3px;display:inline-block}.actions{display:flex;gap:6px}.refresh{color:#e8f1ff;background:#263346;border:1px solid #43536a;border-radius:8px;padding:7px 10px;font:inherit;white-space:nowrap;cursor:pointer}.refresh:disabled{opacity:.6}.refresh.active{background:#235486;border-color:#7ac1ff}.info{flex-direction:column;align-items:stretch}.actions{order:0;justify-content:space-between}.legend{order:1;justify-content:space-between;gap:4px;overflow:visible}.chip{flex-direction:column;font-size:.78rem;text-align:center;min-width:0}.swatch{width:32px;height:8px;border:1px solid rgba(255,255,255,.35);border-radius:5px;box-shadow:0 0 0 2px #080b0f}.time{padding:7px 16px;background:#171b21;color:#cad5e2;font-size:.82rem;min-height:32px}.time.stale{color:#ffd18d;background:#392a1b}.map{flex:1;min-height:0;background:#292d34}.leaflet-container{background:#292d34}.leaflet-control-attribution{background:rgba(15,18,22,.8)!important;color:#dae0e8!important}.leaflet-control-attribution a{color:#a8d0ff!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1d2530;color:#fff}.foot{padding:7px 15px;background:#101217;color:#aab7c7;font-size:.73rem;line-height:1.35}.foot a{color:#a8d0ff}@media(min-width:800px){.top,.info,.time,.foot{padding-left:max(16px,calc((100vw - 1100px)/2));padding-right:max(16px,calc((100vw - 1100px)/2))}}
.map{min-height:180px}.kilometer-panel{height:41dvh;min-height:295px;max-height:470px;display:flex;flex-direction:column;background:#121821;border-top:2px solid #596b83;padding:9px 12px 5px;gap:6px}.km-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.km-toolbar strong{font-size:1rem}.km-toolbar select{font:inherit;color:white;background:#263346;border:1px solid #52647b;border-radius:8px;padding:6px 9px;min-height:34px}.level{display:flex;gap:5px}.level[hidden]{display:none}.level button{flex:1;min-height:32px;color:#d5e3f4;background:#283346;border:1px solid #43546b;border-radius:7px;font:inherit}.level button[aria-pressed=true]{background:#416da2;border-color:#a4cbff;color:white;font-weight:700}.km-heading,.km-row{display:grid;grid-template-columns:52px repeat(2,minmax(0,1fr));gap:5px;align-items:center;text-align:center}.km-heading{color:#d3deec;font-weight:700;font-size:.85rem}.km-list{flex:1;overflow-y:auto;scrollbar-color:#63758a #17212d}.km-row{height:36px;margin:3px 0}.km-label{font-weight:700;font-size:.9rem}.km-cell{height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-weight:750;font-size:.89rem;border:2px solid #080b10}.km-cell.empty{background:#424850;color:#f4f5f6}.km-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.km-foot button{color:white;background:#253447;border:1px solid #4b617b;border-radius:6px;font:inherit;padding:5px 10px}.km-foot span{color:#bdcce0;font-size:.85rem}.km-note{margin:0;color:#aebdd0;font-size:.73rem;line-height:1.35}@media(min-width:800px){.kilometer-panel{width:min(100%,740px);align-self:center;border:1px solid #52657a;border-radius:10px 10px 0 0;padding-inline:16px}}
</style></head><body><div class="app"><header class="top"><div class="header"><a class="back" href="./">← 首頁</a><h1>國道即時路況</h1><span style="width:3rem"></span></div><nav class="tabs" aria-label="查看區域"><button data-region="north" aria-selected="true">北部</button><button data-region="middle">中部</button><button data-region="south">南部</button><button data-region="all">全臺</button></nav></header><div class="info"><div class="legend" aria-label="路況顏色說明"><span class="chip"><i class="swatch" style="background:#21db70"></i>順暢</span><span class="chip"><i class="swatch" style="background:#ffe344"></i>車多</span><span class="chip"><i class="swatch" style="background:#ff9926"></i>緩慢</span><span class="chip"><i class="swatch" style="background:#ff304a"></i>壅塞</span><span class="chip"><i class="swatch" style="background:#b44bff"></i>嚴重</span></div><div class="actions"><button class="refresh" id="locate" type="button">◎ 我的位置</button><button class="refresh" id="refresh" type="button">更新</button></div></div><div class="time" id="status" role="status">讀取路況中…</div><div id="map" class="map" aria-label="國道彩色路況地圖"></div><section class="kilometer-panel" aria-label="每公里雙向路況"><div class="km-toolbar"><strong>每公里路況</strong><select id="road-select" aria-label="選擇國道"><option value="1">國道1號</option><option value="2">國道2號</option><option value="3">國道3號</option><option value="4">國道4號</option><option value="5">國道5號</option><option value="6">國道6號</option><option value="8">國道8號</option><option value="10">國道10號</option></select></div><div class="level" id="level" aria-label="國道1號道路層級"><button type="button" data-level="flat" aria-pressed="true">平面</button><button type="button" data-level="elevated" aria-pressed="false">高架</button></div><div class="km-heading"><span>里程</span><span id="dir-a">北上</span><span id="dir-b">南下</span></div><div class="km-list" id="km-list" role="table" aria-label="各公里與雙向路況"></div><div class="km-foot"><button id="km-prev" type="button">前段</button><span id="km-range"></span><button id="km-next" type="button">後段</button></div><p class="km-note">每格顯示該公里有效測點的路況，並非整公里連續監測；灰色表示無資料。定位無法判定平面或高架，請自行切換。</p></section><footer class="foot">資料：<a href="https://data.gov.tw/dataset/37662" target="_blank" rel="noopener">高公局車輛偵測器</a>；底圖 © OpenStreetMap、CARTO；<a href="https://github.com/watermelon1024/freeway-speed-ui" target="_blank" rel="noopener">路段線型</a>（<a href="GEOMETRY-LICENSE.txt">授權</a>）。灰色路線代表該段暫無有效偵測值。<a href="https://1968.freeway.gov.tw/" target="_blank" rel="noopener">官方 1968</a></footer></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const statusEl = document.querySelector('#status');
const locateButton = document.querySelector('#locate');
const views = {
  north: { center: [25.02, 121.40], zoom: 10 },
  middle: { center: [24.11, 120.76], zoom: 10 },
  south: { center: [22.85, 120.46], zoom: 10 },
  all: { center: [23.74, 120.9], zoom: 7 }
};
let map, roadLayer, casingLayer, roads, traffic, userMarker, userPosition, nearbyFeatures = [];
let region = 'north', dataMessage = '讀取路況中…';

function stamp(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '時間未提供' : new Intl.DateTimeFormat('zh-TW', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }).format(date);
}
function color(speed) {
  if (speed === null) return '#626972';
  if (speed < 20) return '#b44bff';
  if (speed < 40) return '#ff304a';
  if (speed < 60) return '#ff9926';
  if (speed < 80) return '#ffe344';
  return '#21db70';
}
function values(snapshot) {
  const table = new Map();
  for (const row of snapshot.rows || []) {
    let volume = 0, weighted = 0;
    for (const lane of row.lanes || []) {
      if (Number.isFinite(lane.volume) && lane.volume > 0 &&
          Number.isFinite(lane.speed) && lane.speed >= 0) {
        volume += lane.volume;
        weighted += lane.volume * lane.speed;
      }
    }
    if (volume) {
      const id = row.id.split(':').pop();
      const previous = table.get(id) || { volume: 0, weighted: 0 };
      previous.volume += volume;
      previous.weighted += weighted;
      table.set(id, previous);
    }
  }
  return table;
}
const roadSelect = document.querySelector('#road-select');
const levelControl = document.querySelector('#level');
const kmList = document.querySelector('#km-list');
const kmRange = document.querySelector('#km-range');
let roadNumber = '1', roadLevel = 'flat', kilometerStart = 45;
let kilometerBins = new Map(), linkMeta = new Map();
const shownKilometers = 18;
function routeCode() { return 'N' + roadNumber + (roadNumber === '1' && roadLevel === 'elevated' ? 'H' : ''); }
function detectorInfo(row) {
  const match = /^VD-(N\d+[A-Z]?)-([NSEW])-(\d+(?:\.\d+)?)/i.exec(row.id || '');
  if (!match) return null;
  return { code: match[1].toUpperCase(), direction: match[2].toUpperCase(),
    kilometer: Math.floor(Number(match[3])), link: row.id.split(':').pop() };
}
function buildKilometerData(snapshot) {
  kilometerBins = new Map(); linkMeta = new Map();
  for (const row of snapshot.rows || []) {
    const info = detectorInfo(row);
    if (!info) continue;
    linkMeta.set(info.link, info);
    let flow = 0, weighted = 0;
    for (const lane of row.lanes || []) {
      if (Number.isFinite(lane.volume) && lane.volume > 0 &&
          Number.isFinite(lane.speed) && lane.speed >= 0) {
        flow += lane.volume; weighted += lane.volume * lane.speed;
      }
    }
    if (!flow) continue;
    const key = info.code + ':' + info.direction + ':' + info.kilometer;
    const speed = weighted / flow;
    // Several detectors in the same kilometer: preserve the slowest valid reading.
    const old = kilometerBins.get(key);
    if (!old || speed < old.speed) kilometerBins.set(key, { speed, link: info.link });
  }
}
function congestionName(speed) {
  return speed === null ? '無資料' : speed < 20 ? '嚴重壅塞' : speed < 40 ? '壅塞' :
    speed < 60 ? '緩慢' : speed < 80 ? '車多' : '順暢';
}
function renderKilometers() {
  levelControl.hidden = roadNumber !== '1';
  for (const button of levelControl.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.dataset.level === roadLevel));
  }
  const eastWest = ['2', '4', '6', '8', '10'].includes(roadNumber);
  const directions = eastWest ? ['E', 'W'] : ['N', 'S'];
  document.querySelector('#dir-a').textContent = eastWest ? '東行' : '北上';
  document.querySelector('#dir-b').textContent = eastWest ? '西行' : '南下';
  const code = routeCode();
  const miles = [...linkMeta.values()].filter(v => v.code === code).map(v => v.kilometer);
  const minimum = miles.length ? Math.min(...miles) : 0;
  const maximum = miles.length ? Math.max(...miles) : 0;
  kilometerStart = Math.max(minimum, Math.min(kilometerStart, Math.max(minimum, maximum - shownKilometers + 1)));
  kmList.replaceChildren();
  for (let kilometer = kilometerStart; kilometer <= Math.min(maximum, kilometerStart + shownKilometers - 1); kilometer++) {
    const line = document.createElement('div');line.className = 'km-row';line.setAttribute('role', 'row');
    const label = document.createElement('span');label.className = 'km-label';label.textContent = kilometer + 'K';
    line.append(label);
    for (const direction of directions) {
      const item = kilometerBins.get(code + ':' + direction + ':' + kilometer);
      const speed = item ? item.speed : null;
      const cell = document.createElement('div');cell.className = 'km-cell' + (item ? '' : ' empty');
      cell.style.background = color(speed);
      cell.style.color = speed === null || speed < 40 ? '#fff' : '#111';
      cell.textContent = congestionName(speed);
      cell.setAttribute('role', 'cell');
      cell.setAttribute('aria-label', kilometer + '公里' + (direction === 'N' ? '北上' : direction === 'S' ? '南下' : direction === 'E' ? '東行' : '西行') + '：' + congestionName(speed));
      if (item && roads) {
        cell.style.cursor = 'pointer';
        cell.onclick = () => {
          const feature = roads.features.find(f => f.properties.id === item.link);
          if (feature) {
            const center = L.geoJSON(feature).getBounds().getCenter();
            map.setView(center, 12);
          }
        };
      }
      line.append(cell);
    }
    kmList.append(line);
  }
  kmRange.textContent = kilometerStart + 'K–' + Math.min(maximum, kilometerStart + shownKilometers - 1) + 'K';
  document.querySelector('#km-prev').disabled = kilometerStart <= minimum;
  document.querySelector('#km-next').disabled = kilometerStart + shownKilometers > maximum;
  kmList.scrollTop = 0;
}
function nearestRoute(latitude, longitude) {
  let best, distance = Infinity;
  if (!roads) return null;
  for (const feature of roads.features) {
    const info = linkMeta.get(feature.properties.id);
    if (!info || !/^N(1H?|2|3|4|5|6|8|10)$/.test(info.code)) continue;
    const geometry = feature.geometry;
    const lines = geometry.type === 'LineString' ? [geometry.coordinates] : geometry.coordinates;
    const km = Math.min(...lines.map(line => lineDistanceKm(line, latitude, longitude)));
    // GPS cannot resolve an elevated deck from the ground road. Prefer ground on ties.
    const adjusted = km + (info.code === 'N1H' ? .02 : 0);
    if (adjusted < distance) { distance = adjusted; best = info; }
  }
  return best && distance < 60 ? best : null;
}
function chooseRouteAt(latitude, longitude) {
  const nearest = nearestRoute(latitude, longitude);
  if (!nearest) return;
  const road = /^N(\d+)/.exec(nearest.code);
  roadNumber = road[1]; roadLevel = nearest.code === 'N1H' ? 'elevated' : 'flat';
  roadSelect.value = roadNumber;
  kilometerStart = Math.max(0, nearest.kilometer - 2);
  renderKilometers();
}

// Find roads near the GPS point, including lines that cross the area between vertices.
function lineDistanceKm(line, latitude, longitude) {
  const scaleX = 111 * Math.cos(latitude * Math.PI / 180), scaleY = 111;
  let closest = Infinity;
  for (let i = 0; i < line.length; i++) {
    const a = line[i], b = line[Math.min(i + 1, line.length - 1)];
    const ax = (a[0] - longitude) * scaleX, ay = (a[1] - latitude) * scaleY;
    const bx = (b[0] - longitude) * scaleX, by = (b[1] - latitude) * scaleY;
    const dx = bx - ax, dy = by - ay;
    const t = dx || dy ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / (dx * dx + dy * dy))) : 0;
    closest = Math.min(closest, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return closest;
}
function nearby(feature, latitude, longitude, radiusKm) {
  const geometry = feature.geometry;
  const lines = geometry.type === 'LineString' ? [geometry.coordinates] : geometry.coordinates;
  return lines.some(line => lineDistanceKm(line, latitude, longitude) <= radiusKm);
}
function displayedRoads() {
  if (!roads) return roads;
  const selected = roads.features.filter(f => linkMeta.get(f.properties.id)?.code === routeCode());
  if (region !== 'nearby' || !userPosition) return { type: 'FeatureCollection', features: selected };
  const [latitude, longitude] = userPosition;
  let features = selected.filter(f => nearby(f, latitude, longitude, 12));
  if (!features.length) features = selected.filter(f => nearby(f, latitude, longitude, 25));
  if (!features.length) features = selected.filter(f => nearby(f, latitude, longitude, 60));
  nearbyFeatures = features;
  statusEl.textContent = features.length ? '附近國道路況｜' + dataMessage : '附近沒有此國道路段｜' + dataMessage;
  return { type: 'FeatureCollection', features };
}
function severity(feature) {
  const value = traffic?.get(feature.properties.id);
  if (!value) return 0;
  const speed = value.weighted / value.volume;
  return speed < 20 ? 5 : speed < 40 ? 4 : speed < 60 ? 3 : speed < 80 ? 2 : 1;
}
function draw() {
  if (!roads || !map) return;
  if (roadLayer) roadLayer.remove();
  if (casingLayer) casingLayer.remove();
  const source = displayedRoads();
  const ordered = [...source.features].sort((a, b) => severity(a) - severity(b));
  const renderer = L.canvas({ padding: .5 });
  const narrow = matchMedia('(max-width: 700px)').matches;
  const stroke = narrow ? 9 : 8;
  // An opaque dark casing keeps each saturated route distinct from the basemap.
  casingLayer = L.geoJSON({ type: 'FeatureCollection', features: ordered.filter(f => severity(f) > 0) }, {
    renderer, interactive: false,
    style: { color: '#07090d', weight: stroke + 5, opacity: 1, lineCap: 'round', lineJoin: 'round' }
  }).addTo(map);
  roadLayer = L.geoJSON({ type: 'FeatureCollection', features: ordered }, {
    renderer,
    style: feature => {
      const value = traffic?.get(feature.properties.id);
      return { color: color(value ? Math.round(value.weighted / value.volume) : null),
        weight: value ? stroke : 3, opacity: 1, lineCap: 'round', lineJoin: 'round' };
    },
    onEachFeature: (feature, layer) => layer.on('click', () => {
      const value = traffic?.get(feature.properties.id);
      const speed = value ? Math.round(value.weighted / value.volume) : null;
      const label = speed === null ? '暫無有效路況' : speed < 20 ? '嚴重壅塞' :
        speed < 40 ? '壅塞' : speed < 60 ? '緩慢' : speed < 80 ? '車多' : '順暢';
      const box = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = feature.properties.name || '國道路段';
      const state = document.createElement('p');
      state.textContent = label;
      box.append(title, state);
      layer.bindPopup(box).openPopup();
    })
  }).addTo(map);
  if (userMarker) userMarker.bringToFront();
}
function focusNearby() {
  if (!nearbyFeatures.length || !userPosition) return;
  const [lat, lon] = userPosition;
  const colored = nearbyFeatures.filter(f => traffic?.has(f.properties.id));
  const candidates = colored.length ? colored : nearbyFeatures;
  let closest = [lat, lon], shortest = Infinity;
  const scaleX = 111 * Math.cos(lat * Math.PI / 180);
  for (const feature of candidates) {
    const geometry = feature.geometry;
    const lines = geometry.type === 'LineString' ? [geometry.coordinates] : geometry.coordinates;
    for (const line of lines) for (const point of line) {
      const distance = Math.hypot((point[0] - lon) * scaleX, (point[1] - lat) * 111);
      if (distance < shortest) { shortest = distance; closest = [point[1], point[0]]; }
    }
  }
  map.fitBounds(L.latLngBounds([userPosition, closest]).pad(.5), { padding: [50, 50], maxZoom: 12 });
}
async function load() {
  statusEl.textContent = '讀取路況中…';
  try {
    const [geometry, response] = await Promise.all([
      roads ? Promise.resolve(roads) : fetch('highway_links.geojson').then(r => {
        if (!r.ok) throw Error('地圖讀取失敗');
        return r.json();
      }),
      fetch('traffic.json?t=' + Date.now(), { cache: 'no-store' })
    ]);
    if (!response.ok) throw Error('資料讀取失敗');
    roads = geometry;
    const snapshot = await response.json();
    traffic = values(snapshot);
    buildKilometerData(snapshot);
    renderKilometers();
    const sourceTime = snapshot.sourceTime || snapshot.generatedAt;
    const age = Date.now() - new Date(sourceTime).getTime();
    const stale = !Number.isFinite(age) || age > 30 * 60 * 1000;
    dataMessage = (stale ? '⚠ 資料已過期｜' : '') + '資料時間：' + stamp(sourceTime);
    statusEl.classList.toggle('stale', stale);
    statusEl.textContent = dataMessage;
    draw();
  } catch (error) {
    statusEl.classList.add('stale');
    statusEl.textContent = '目前無法讀取路況，請稍後重試。';
  }
}
function select(name) {
  region = name;
  locateButton.classList.remove('active');
  for (const button of document.querySelectorAll('[data-region]')) {
    button.setAttribute('aria-selected', String(button.dataset.region === name));
  }
  statusEl.textContent = dataMessage;
  if (userMarker) { userMarker.remove(); userMarker = null; }
  map.setView(views[name].center, views[name].zoom);
  const selected = nearestRoute(...views[name].center);
  if (selected && selected.code === routeCode()) kilometerStart = Math.max(0, selected.kilometer - 2);
  renderKilometers();
  draw();
}
function locate() {
  if (!navigator.geolocation) {
    statusEl.textContent = dataMessage + '｜此裝置無法使用定位。';
    return;
  }
  locateButton.disabled = true;
  statusEl.textContent = '正在取得你的位置…';
  navigator.geolocation.getCurrentPosition(position => {
    locateButton.disabled = false;
    const { latitude, longitude } = position.coords;
    userPosition = [latitude, longitude];
    chooseRouteAt(latitude, longitude);
    region = 'nearby';
    for (const button of document.querySelectorAll('[data-region]')) button.setAttribute('aria-selected', 'false');
    locateButton.classList.add('active');
    if (userMarker) userMarker.remove();
    userMarker = L.circleMarker(userPosition, {
      radius: 9, color: '#fff', weight: 3, fillColor: '#2989ff', fillOpacity: 1,
      interactive: false
    }).addTo(map);
    draw();
    if (nearbyFeatures.length) focusNearby();
    else map.setView(userPosition, 11);
  }, error => {
    locateButton.disabled = false;
    const detail = error.code === 1 ? '請在瀏覽器允許位置存取。' : '無法取得位置，請稍後再試。';
    statusEl.textContent = dataMessage + '｜' + detail;
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
if (window.L) {
  map = L.map('map', { preferCanvas: true, zoomControl: false }).setView(views.north.center, views.north.zoom);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18
  }).addTo(map);
  document.querySelectorAll('[data-region]').forEach(button => button.onclick = () => select(button.dataset.region));
  document.querySelector('#refresh').onclick = load;
  locateButton.onclick = locate;
  roadSelect.onchange = () => {
    roadNumber = roadSelect.value;
    roadLevel = 'flat';
    kilometerStart = 0;
    renderKilometers();
    draw();
  };
  levelControl.querySelectorAll('button').forEach(button => button.onclick = () => {
    roadLevel = button.dataset.level;
    renderKilometers();
    draw();
  });
  document.querySelector('#km-prev').onclick = () => {
    kilometerStart -= shownKilometers;
    renderKilometers();
  };
  document.querySelector('#km-next').onclick = () => {
    kilometerStart += shownKilometers;
    renderKilometers();
  };
  load();
} else {
  statusEl.textContent = '地圖元件載入失敗，請重新整理頁面。';
}
</script></body></html>
