<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>William 的捷徑</title>
  <style>
    *{box-sizing:border-box}
    html{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
    body{margin:0;min-height:100svh}
    main{max-width:760px;margin:auto;padding:clamp(28px,5vw,44px) clamp(17px,4vw,32px) 70px}
    .heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}
    h1{font-size:clamp(32px,7vw,46px);font-weight:800;letter-spacing:-.045em;margin:2px 0}
    .add{width:44px;height:44px;border:1px solid #48484d;border-radius:50%;background:#202024;color:white;font-size:32px;line-height:1;cursor:pointer}
    .search{height:55px;display:flex;align-items:center;gap:13px;padding:0 18px;border-radius:28px;background:#242428;color:#b5b5bb}
    .search svg{width:22px;height:22px;flex:none}
    input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:17px}
    input::placeholder{color:#9e9ea5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}
    .card{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:clamp(166px,42vw,220px);padding:18px;border-radius:28px;overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;box-shadow:inset 0 1px 0 #ffffff25;transition:transform .16s ease,filter .16s ease}
    .card[hidden]{display:none}
    .card:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .card:active{transform:scale(.975)}
    .card:focus-visible{outline:3px solid white;outline-offset:3px}
    .stocks{background:radial-gradient(circle at 85% 5%,#51baffaa,transparent 62%),linear-gradient(145deg,#1498e9 0%,#096bb4 47%,#123d98 100%)}
    .traffic{background:radial-gradient(circle at 88% 3%,#76efaf99,transparent 62%),linear-gradient(145deg,#12bdaa 0%,#0a9c80 48%,#076c59 100%)}
    .docking{background:radial-gradient(circle at 85% 0%,#e7afffa3,transparent 64%),linear-gradient(145deg,#ad6fd2 0%,#8550b7 50%,#51308a 100%)}
    .windy{background:radial-gradient(circle at 85% 0%,#ffc37dba,transparent 65%),linear-gradient(145deg,#ef714c 0%,#d64b53 50%,#983071 100%)}
    .custom{background:radial-gradient(circle at 82% 0%,#ffba70b3,transparent 64%),linear-gradient(145deg,#ed9d21,#ba5713 56%,#89371a)}
    .icon{width:36px;height:36px;display:grid;place-items:center;flex:none}
    .icon svg{width:34px;height:34px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .title{font-size:clamp(19px,4.8vw,27px);font-weight:720;line-height:1.25;letter-spacing:-.025em;overflow-wrap:anywhere}
    .empty{display:none;text-align:center;color:#a8a8ae;padding:42px 0}
    .tip{color:#9e9ea5;font-size:13px;margin:18px 2px}
    dialog{width:min(92vw,380px);max-height:85svh;overflow:auto;border:1px solid #3b3b40;border-radius:24px;padding:22px;background:#202024;color:white;box-shadow:0 24px 80px #000a}
    dialog::backdrop{background:#000a}
    dialog h2{font-size:21px;margin:0 0 17px}
    .actions{display:grid;gap:10px}
    .action{width:100%;min-height:48px;border:0;border-radius:13px;background:#33333a;color:#fff;font:inherit;font-weight:600;cursor:pointer}
    .action.primary{background:#2876da}.action.danger{color:#ff9a9a}.action:disabled{opacity:.4}
    .field{display:grid;gap:7px;font-size:14px;margin:12px 0;color:#c5c5ca}
    .field input{width:100%;height:46px;padding:0 12px;border:1px solid #56565e;border-radius:11px;background:#2c2c32;color:white;font-size:16px}
    .form-error{color:#ff9a9a;min-height:21px;font-size:13px}
    .recommendations{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 22px}
    .recommendation{min-height:72px;border:1px solid #505058;border-radius:14px;padding:11px;text-align:left;background:#313139;color:#fff;font:inherit;cursor:pointer}
    .recommendation strong,.recommendation small{display:block}.recommendation strong{font-size:15px}.recommendation small{font-size:12px;color:#bebec5;margin-top:4px}.recommendation:disabled{opacity:.55;cursor:default}
    .form-section{border-top:1px solid #45454b;padding-top:18px;font-size:16px;font-weight:700}
    @media(max-width:370px){.card{padding:16px;border-radius:23px;min-height:160px}.grid{gap:11px}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body><main>
  <div class="heading"><h1>我的捷徑</h1><button id="add" class="add" type="button" aria-label="新增捷徑">+</button></div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.4 16.4 5 5"/></svg>
    <input id="search" type="search" placeholder="搜尋" aria-label="搜尋捷徑" autocomplete="off">
  </label>
  <nav class="grid" aria-label="資訊分類">
    <a class="card stocks" href="stocks.html" data-id="stocks" data-search="股票 股價 美股 新聞" aria-label="股票：股價與新聞">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M4 26 13 18l6 4 12-14"/><path d="M24 8h7v7"/></svg></span><span class="title">股票</span>
    </a>
    <a class="card traffic" href="https://1968.freeway.gov.tw/" data-id="traffic" data-search="國道 1968 高速公路 路況 塞車" aria-label="國道 1968：即時路況">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M12 3 7 33M24 3l5 30M18 7v6m0 8v8"/></svg></span><span class="title">國道 1968</span>
    </a>
    <a class="card docking" href="https://william-ship-dock-schedule.twl13572468.chatgpt.site/" data-id="docking" data-search="船舶 塢修 船齡 船名 三大證 進廠 離廠" aria-label="船舶塢修：查詢時程與證書到期日">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M3 22h30l-5 9H9zM11 22V8h14v14M17 8V4h8v4M15 15h2m4 0h2"/></svg></span><span class="title">船舶塢修</span>
    </a>
    <a class="card windy" href="https://www.windy.com/" data-id="windy" data-search="Windy 天氣 風場 颱風 海象 氣象" aria-label="Windy：開啟風場與天氣地圖">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M3 14h21c8 0 8-10 1-10-4 0-6 3-5 5M3 21h27c6 0 6 9 0 9-3 0-5-2-5-4M3 28h15c6 0 6 6 2 6"/></svg></span><span class="title">Windy 天氣</span>
    </a>
  </nav>
  <p id="empty" class="empty" role="status">沒有符合的捷徑</p>
  <p class="tip">按住方塊可新增或刪除捷徑</p>
</main>
<dialog id="manage"><h2 id="manage-title">管理捷徑</h2><div class="actions"><button class="action primary" id="manage-add" type="button">新增捷徑</button><button class="action danger" id="manage-delete" type="button">刪除此捷徑</button><button class="action" id="manage-restore" type="button">還原預設方塊</button><button class="action" id="manage-close" type="button">取消</button></div></dialog>
<dialog id="add-dialog"><h2>新增捷徑</h2><div class="form-section">推薦捷徑 · 點一下直接新增</div><div id="recommendations" class="recommendations"></div><form id="add-form"><div class="form-section">或自行新增</div><label class="field">名稱<input id="shortcut-name" name="name" maxlength="24" required placeholder="例如：我的常用網站"></label><label class="field">網址<input id="shortcut-url" name="url" type="url" inputmode="url" required placeholder="https://..."></label><p id="form-error" class="form-error" role="alert"></p><div class="actions"><button class="action primary" type="submit">儲存自訂捷徑</button><button class="action" id="add-cancel" type="button">取消</button></div></form></dialog>
<script>
  const search=document.getElementById('search'),grid=document.querySelector('.grid'),empty=document.getElementById('empty'),manage=document.getElementById('manage'),addDialog=document.getElementById('add-dialog');
  const key='william-shortcuts-v1',defaults=[...grid.querySelectorAll('[data-id]')],builtinIds=new Set(defaults.map(a=>a.dataset.id));
  const recommendations=[{name:'中央氣象署',description:'天氣與颱風',url:'https://www.cwa.gov.tw/'},{name:'Google 雲端硬碟',description:'常用工作檔案',url:'https://drive.google.com/'},{name:'台灣高鐵',description:'班次與訂票',url:'https://www.thsrc.com.tw/'},{name:'Yahoo Finance',description:'美股市場資訊',url:'https://finance.yahoo.com/'}];
  let state={hidden:[],custom:[]},selected=null,hold=null,suppressClick=false;
  try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.hidden)&&Array.isArray(saved.custom))state=saved}catch{}
  state.hidden=state.hidden.filter(id=>builtinIds.has(id));state.custom=state.custom.filter(x=>x&&typeof x.name==='string'&&typeof x.url==='string'&&/^https:\/\//i.test(x.url));
  function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}
  function render(){for(const a of defaults)a.hidden=state.hidden.includes(a.dataset.id);grid.querySelectorAll('.custom').forEach(a=>a.remove());for(const item of state.custom){let a=document.createElement('a');a.className='card custom';a.href=item.url;a.dataset.id=item.id;a.dataset.search=item.name;a.setAttribute('aria-label',item.name);let icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent='↗';icon.style.fontSize='34px';let title=document.createElement('span');title.className='title';title.textContent=item.name;a.append(icon,title);grid.append(a)}filter()}
  function filter(){let term=search.value.trim().toLocaleLowerCase(),count=0;for(const card of grid.querySelectorAll('.card')){let show=!state.hidden.includes(card.dataset.id)&&card.dataset.search.toLocaleLowerCase().includes(term);card.hidden=!show;if(show)count++}empty.style.display=count?'none':'block'}
  function openManage(card){selected=card;document.getElementById('manage-title').textContent=card?'管理「'+card.querySelector('.title').textContent+'」':'管理捷徑';document.getElementById('manage-delete').disabled=!card;manage.showModal()}
  function renderRecommendations(){let container=document.getElementById('recommendations');container.replaceChildren();for(const item of recommendations){let button=document.createElement('button');button.type='button';button.className='recommendation';button.disabled=state.custom.some(x=>x.url===item.url);let name=document.createElement('strong'),detail=document.createElement('small');name.textContent=item.name;detail.textContent=button.disabled?'已新增':item.description;button.append(name,detail);button.addEventListener('click',()=>addShortcut(item.name,item.url));container.append(button)}}
  function openAdd(){if(manage.open)manage.close();document.getElementById('add-form').reset();document.getElementById('form-error').textContent='';renderRecommendations();addDialog.showModal()}
  function addShortcut(name,url){state.custom.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,url});if(!save()){state.custom.pop();document.getElementById('form-error').textContent='此瀏覽器無法儲存捷徑';return}addDialog.close();search.value='';render()}
  document.getElementById('add').addEventListener('click',openAdd);
  document.getElementById('manage-add').addEventListener('click',openAdd);
  document.getElementById('manage-close').addEventListener('click',()=>manage.close());
  document.getElementById('add-cancel').addEventListener('click',()=>addDialog.close());
  document.getElementById('manage-delete').addEventListener('click',()=>{if(!selected)return;let id=selected.dataset.id;if(builtinIds.has(id))state.hidden.push(id);else state.custom=state.custom.filter(x=>x.id!==id);save();manage.close();render()});
  document.getElementById('manage-restore').addEventListener('click',()=>{state.hidden=[];save();manage.close();render()});
  document.getElementById('add-form').addEventListener('submit',e=>{e.preventDefault();let name=document.getElementById('shortcut-name').value.trim(),raw=document.getElementById('shortcut-url').value.trim(),url;try{url=new URL(raw);if(url.protocol!=='https:')throw Error()}catch{document.getElementById('form-error').textContent='請輸入 https:// 開頭的網址';return}if(name)addShortcut(name,url.href)});
  search.addEventListener('input',filter);
  function cancelHold(){if(hold){clearTimeout(hold.timer);hold=null}}
  grid.addEventListener('pointerdown',e=>{let card=e.target.closest('.card');if(!card)return;suppressClick=false;cancelHold();hold={x:e.clientX,y:e.clientY,timer:setTimeout(()=>{suppressClick=true;openManage(card);hold=null},550)}});
  grid.addEventListener('pointermove',e=>{if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>14)cancelHold()});
  grid.addEventListener('pointerup',cancelHold);grid.addEventListener('pointercancel',cancelHold);
  grid.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation();suppressClick=false}},true);
  grid.addEventListener('contextmenu',e=>{let card=e.target.closest('.card');if(card){e.preventDefault();cancelHold();suppressClick=true;if(!manage.open)openManage(card)}});
  render();
</script></body></html>
