<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>William 的美股追蹤</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eaf1ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1050px;margin:auto;padding:22px}h1{margin-bottom:4px;font-size:clamp(26px,5vw,40px)}p,small{color:#aabbd4;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.stock,.panel{border:1px solid #2b3c59;background:#152239;border-radius:18px}.stock{padding:18px;text-align:left;color:inherit;cursor:pointer;font:inherit}.stock[aria-pressed=true]{border-color:#76aaff;background:#1d3152}.stock strong{display:block;font-size:26px}.stock span{font-size:13px;color:#b3c6e1}.panel{padding:20px;margin-bottom:18px}.links{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.links a{display:inline-block;background:#29456d;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none}.chart{height:470px}.notice{font-size:13px}.fallback{padding:10px 0;color:#b3c6e1}.fallback a{color:#9cc4ff}.widget{width:100%;height:100%}@media(max-width:700px){main{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.stock{padding:14px}.chart{height:390px}}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 12px}
.stock{display:grid;grid-template-columns:minmax(95px,.8fr) minmax(0,1.7fr);gap:12px;align-items:center;padding:18px 16px;min-width:0}
.stock:focus-visible{outline:3px solid #9cc4ff;outline-offset:3px}.stock:hover{border-color:#76aaff}
.stock .identity{min-width:0}.stock .identity span{display:block;margin-top:5px;line-height:1.5}
.stock strong{font-size:25px}.stock .quote{display:flex;flex-direction:column;gap:10px;min-width:0;font-variant-numeric:tabular-nums}
.stock .quote-row{display:grid;grid-template-columns:32px 1fr auto;align-items:baseline;gap:4px 6px}
.stock .quote-label{font-size:11px;color:#b3c6e1}.stock .quote-price{color:#f2f6ff;font-size:18px;font-weight:700;white-space:nowrap;text-align:right}
.stock .quote-change{font-size:13px;font-weight:650;white-space:nowrap;text-align:right}
.stock .up{color:#64e5ac}.stock .down{color:#ff8993}.stock .flat{color:#b3c6e1}
.stock .quote-time{grid-column:2/4;font-size:10px;color:#9aaecb;text-align:right}
.stock .quote-empty{font-size:11px;text-align:right;color:#9aaecb;line-height:1.5}.stock .quote-warning{font-size:11px;color:#ffd58a;text-align:right}
.quote-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
#quote-status{font-size:12px;color:#aabbd4;line-height:1.5}.refresh{background:#213755;color:#dbeaff;border:1px solid #456188;border-radius:8px;padding:8px 12px;white-space:nowrap;cursor:pointer}.refresh:disabled{opacity:.5}
.quote-note{font-size:12px;margin:5px 0 22px;line-height:1.7}.quote-note a{color:#9cc4ff}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stock{grid-template-columns:minmax(100px,1fr) minmax(0,1.6fr)}}
@media(max-width:380px){.stock{padding:14px 10px;gap:6px;grid-template-columns:90px minmax(0,1fr)}.stock .quote-price{font-size:16px}.stock .quote-change{font-size:12px}.stock strong{font-size:23px}}
</style></head><body><main><h1>美股每日追蹤 ↗</h1><p>William 的關注清單｜股價圖表、財報、公司新聞</p><div class="grid" id="stocks" aria-label="股票與最新行情"></div>
<div class="quote-toolbar"><span id="quote-status" role="status"></span><button class="refresh" id="refresh-quotes" type="button">重新讀取行情</button></div>
<p class="quote-note">全部價格為美元（USD）｜綠 ▲ 上漲・紅 ▼ 下跌<br>資料來源：<a href="https://finance.yahoo.com/" target="_blank" rel="noopener noreferrer">Yahoo Finance</a>。美股交易時段約每 5 分鐘擷取，排程及來源可能延遲，非逐筆即時；休市顯示最後行情。各列時間均為台北時間。一般時段漲跌幅相對前一交易日收盤；盤前／盤後相對最近一次一般時段收盤。</p><section class="panel"><h2 id="heading">Tesla · TSLA</h2><p class="notice">第三方行情可能延遲。圖表無法載入時，請使用下方 Nasdaq 或 Yahoo Finance 的備援連結。</p><div class="links" id="links"></div><div class="chart" id="chart"></div><div class="fallback" id="fallback"></div></section><section class="panel"><h2>相關新聞</h2><div class="links" id="news"></div></section><p class="notice">資料由第三方提供，請以交易所與公司正式公告為準；本站不提供投資建議。</p></main><script>
const data=[{s:'TSLA',n:'Tesla 特斯拉',ir:'https://ir.tesla.com/'},{s:'MSFT',n:'Microsoft 微軟',ir:'https://www.microsoft.com/en-us/Investor'},{s:'NVDA',n:'NVIDIA 輝達',ir:'https://investor.nvidia.com/'},{s:'SPCX',n:'SpaceX',ir:'https://ir.spacex.com/investors/default.aspx'}];
const root=document.getElementById('stocks'),links=document.getElementById('links'),chart=document.getElementById('chart');let active=(location.hash||'#TSLA').slice(1).toUpperCase();if(!data.some(x=>x.s===active))active='TSLA';function link(label,url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;return a}function show(symbol){const x=data.find(v=>v.s===symbol)||data[0];active=x.s;location.hash=x.s;root.replaceChildren();data.forEach(v=>{const b=document.createElement('button');b.className='stock';b.setAttribute('aria-pressed',String(v.s===active));const strong=document.createElement('strong');strong.textContent=v.s;const span=document.createElement('span');span.textContent=v.n;const identity=document.createElement('span');identity.className='identity';identity.append(strong,span);b.append(identity);b.onclick=()=>show(v.s);root.append(b)});window.renderQuotes?.();document.getElementById('heading').textContent=x.n+' · '+x.s;links.replaceChildren(link('Nasdaq 股價','https://www.nasdaq.com/market-activity/stocks/'+x.s.toLowerCase()),link('Yahoo Finance','https://finance.yahoo.com/quote/'+x.s+'/'),link('官方投資人關係／財報',x.ir));document.getElementById('fallback').replaceChildren(document.createTextNode('SPCX 或其他股票若無法顯示圖表，請改用 '),link('Nasdaq 行情頁','https://www.nasdaq.com/market-activity/stocks/'+x.s.toLowerCase()),document.createTextNode('。'));document.getElementById('news').replaceChildren(link('Google 新聞','https://www.google.com/search?tbm=nws&q='+encodeURIComponent(x.n+' '+x.s)),link('Yahoo Finance 新聞','https://finance.yahoo.com/quote/'+x.s+'/news/'));chart.replaceChildren();const wrap=document.createElement('div');wrap.className='tradingview-widget-container widget';const inner=document.createElement('div');inner.className='tradingview-widget-container__widget';inner.style.height='100%';wrap.append(inner);const sc=document.createElement('script');sc.async=true;sc.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';sc.textContent=JSON.stringify({autosize:true,symbol:'NASDAQ:'+x.s,interval:'D',timezone:'Asia/Taipei',theme:'dark',style:'1',locale:'zh_TW',allow_symbol_change:false,support_host:'https://www.tradingview.com'});wrap.append(sc);chart.append(wrap)}window.addEventListener('hashchange',()=>{const s=location.hash.slice(1).toUpperCase();if(s!==active&&data.some(x=>x.s===s))show(s)});show(active);
</script><script src="quotes.js"></script></body></html>
