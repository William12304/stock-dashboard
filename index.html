<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>William 的捷徑</title>
  <style>
    *{box-sizing:border-box}
    html{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
    body{margin:0;min-height:100svh}
    main{max-width:760px;margin:auto;padding:clamp(28px,5vw,44px) clamp(17px,4vw,32px) 70px}
    h1{font-size:clamp(32px,7vw,46px);font-weight:800;letter-spacing:-.045em;margin:2px 0 19px}
    .search{height:55px;display:flex;align-items:center;gap:13px;padding:0 18px;border-radius:28px;background:#242428;color:#b5b5bb}
    .search svg{width:22px;height:22px;flex:none}
    input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:17px}
    input::placeholder{color:#9e9ea5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}
    .card{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:145px;aspect-ratio:1.35;padding:20px;border-radius:28px;overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;box-shadow:inset 0 1px 0 #ffffff25;transition:transform .16s ease,filter .16s ease}
    .card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 72% 7%,#ffffff26,transparent 58%)}
    .card[hidden]{display:none}
    .card:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .card:active{transform:scale(.975)}
    .card:focus-visible{outline:3px solid white;outline-offset:3px}
    .stocks{background:linear-gradient(145deg,#196fc5,#035191)}
    .traffic{background:linear-gradient(145deg,#14a66f,#08734f)}
    .docking{background:linear-gradient(145deg,#9a63c4,#603491)}
    .icon{width:36px;height:36px;display:grid;place-items:center}
    .icon svg{width:34px;height:34px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .title{font-size:clamp(19px,4.8vw,27px);font-weight:720;line-height:1.18;letter-spacing:-.025em;text-wrap:balance}
    .empty{display:none;text-align:center;color:#a8a8ae;padding:42px 0}
    @media(max-width:370px){.card{padding:16px;border-radius:23px;min-height:128px}.grid{gap:11px}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body><main>
  <h1>我的捷徑</h1>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.4 16.4 5 5"/></svg>
    <input id="search" type="search" placeholder="搜尋" aria-label="搜尋捷徑" autocomplete="off">
  </label>
  <nav class="grid" aria-label="資訊分類">
    <a class="card stocks" href="stocks.html" data-search="股票 股價 美股 新聞" aria-label="股票：股價與新聞">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M4 26 13 18l6 4 12-14"/><path d="M24 8h7v7"/></svg></span><span class="title">股票</span>
    </a>
    <a class="card traffic" href="https://1968.freeway.gov.tw/" data-search="國道 1968 高速公路 路況 塞車" aria-label="國道 1968：即時路況">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M12 3 7 33M24 3l5 30M18 7v6m0 8v8"/></svg></span><span class="title">國道 1968</span>
    </a>
    <a class="card docking" href="https://william-ship-dock-schedule.twl13572468.chatgpt.site/" data-search="船舶 塢修 船齡 船名 三大證 進廠 離廠" aria-label="船舶塢修：查詢時程與證書到期日">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M3 22h30l-5 9H9zM11 22V8h14v14M17 8V4h8v4M15 15h2m4 0h2"/></svg></span><span class="title">船舶塢修</span>
    </a>
  </nav>
  <p id="empty" class="empty" role="status">沒有符合的捷徑</p>
</main>
<script>
  const search=document.getElementById('search'),cards=[...document.querySelectorAll('.card')],empty=document.getElementById('empty');
  search.addEventListener('input',()=>{let term=search.value.trim().toLocaleLowerCase(),count=0;for(const card of cards){let show=card.dataset.search.toLocaleLowerCase().includes(term);card.hidden=!show;if(show)count++}empty.style.display=count?'none':'block'});
</script></body></html>
