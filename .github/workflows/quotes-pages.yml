name: Update quotes and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Public traffic snapshot, around every ten minutes (GitHub scheduling can lag).
    - cron: '2-52/10 * * * *'

permissions:
  contents: read

concurrency:
  group: stock-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test quote calculations
        run: python3 -m unittest discover -s tests
      - name: Fetch quotes
        continue-on-error: true
        run: python3 scripts/update_quotes.py
      - name: Preserve last quotes if quote provider is unavailable
        run: |
          if [ ! -s quotes.json ]; then
            curl -fsSL --max-time 15 https://william12304.github.io/stock-dashboard/quotes.json -o quotes.json || printf '%s' '{"quotes":{}}' > quotes.json
          fi
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html stocks.html traffic.html windy.html card-scan.html quotes.js quotes.json app-icon-180.png app-icon-192.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
