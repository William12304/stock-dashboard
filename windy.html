<title>Windy 天氣地圖</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111318;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
header{position:absolute;top:0;left:0;right:0;height:54px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111318;z-index:2}
strong{font-size:18px}.full{font-size:13px;color:#cce2ff;text-decoration:none;border:1px solid #637086;border-radius:16px;padding:8px 11px}
iframe{position:absolute;top:54px;left:0;width:100%;height:calc(100% - 54px);height:calc(100dvh - 54px);border:0;background:#202a38}
.back{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:center;justify-content:center;min-height:54px;min-width:122px;padding:0 18px;border:1px solid #ffffff95;border-radius:30px;background:#1e2c41ef;backdrop-filter:blur(14px);box-shadow:0 6px 24px #0009;color:#fff;text-decoration:none;font-size:16px;font-weight:700}
.back:focus-visible,.full:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head>
